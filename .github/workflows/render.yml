name: Render iCHEF Page

on:
  workflow_dispatch:
    inputs:
      store_url:
        description: "iCHEF 店家網址"
        required: true
        type: string

      company_name:
        description: "公司名稱"
        required: true
        type: string

      browser_locale:
        description: "瀏覽器語系"
        required: true
        default: "zh-TW"
        type: choice
        options:
          - zh-TW
          - en-US

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check Chrome
        run: google-chrome --version

      - name: Render PDF
        env:
          STORE_URL: ${{ inputs.store_url }}
          COMPANY_NAME: ${{ inputs.company_name }}
          BROWSER_LOCALE: ${{ inputs.browser_locale }}
        run: node render.js

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ichef-pdf
          path: output.pdf
          retention-days: 1
